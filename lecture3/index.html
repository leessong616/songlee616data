<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>3차시 강의안 · 스노클 활용하기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#faf6ee;--paper:#fffdf8;--ink:#2b2a27;--mute:#6c675d;--line:#e4dcc9;--ocher:#b4781f;--ocher-bg:#f7ecd5;--teal:#1f7a78;--teal-bg:#e1f1ef;--warn:#a8432c;--warn-bg:#f9e6e0}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:64px}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'IBM Plex Sans KR',sans-serif;line-height:1.75;word-break:keep-all;font-size:16px}
header.hero{padding:56px 24px 40px;background:linear-gradient(135deg,#f3e3bf,#e1f1ef);border-bottom:1px solid var(--line)}
.wrap{max-width:960px;margin:0 auto}
.eyebrow{font-size:13px;letter-spacing:.14em;color:var(--ocher);font-weight:700;margin:0 0 10px}
h1{font-family:'Gowun Batang',serif;font-size:clamp(28px,5vw,42px);line-height:1.3;margin:0 0 14px}
.lead{font-size:17px;color:#4a463e;max-width:42em;margin:0}
nav{position:sticky;top:0;z-index:5;background:rgba(250,246,238,.94);backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
nav .wrap{display:flex;gap:4px;overflow-x:auto;padding:8px 16px}
nav a{white-space:nowrap;text-decoration:none;color:var(--mute);font-size:14px;padding:6px 12px;border-radius:99px}
nav a:hover{background:var(--ocher-bg);color:var(--ocher)}
section{padding:44px 24px 8px}
h2{font-family:'Gowun Batang',serif;font-size:26px;margin:0 0 6px}
h2 .no{color:var(--ocher);margin-right:8px}
h3{font-size:17px;margin:26px 0 8px}
p{margin:0 0 12px}
.sub{color:var(--mute);margin-bottom:22px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin:0 0 14px}
.note{border-left:4px solid var(--teal);background:var(--teal-bg);padding:12px 16px;border-radius:0 10px 10px 0;margin:14px 0}
.warn{border-left:4px solid var(--warn);background:var(--warn-bg);padding:12px 16px;border-radius:0 10px 10px 0;margin:14px 0}
.gold{border-left:4px solid var(--ocher);background:var(--ocher-bg);padding:12px 16px;border-radius:0 10px 10px 0;margin:14px 0}
table{width:100%;border-collapse:collapse;background:var(--paper);border:1px solid var(--line);border-radius:12px;overflow:hidden;font-size:15px}
th,td{padding:10px 12px;text-align:left;vertical-align:top;border-bottom:1px solid var(--line)}
th{background:var(--ocher-bg);font-weight:600}
tr:last-child td{border-bottom:0}
.time{font-weight:700;color:var(--ocher);white-space:nowrap}
.tag{display:inline-block;font-size:12px;font-weight:600;padding:2px 9px;border-radius:99px;background:var(--teal-bg);color:var(--teal);margin-right:6px}
.tag.o{background:var(--ocher-bg);color:var(--ocher)}
.tag.w{background:var(--warn-bg);color:var(--warn)}
.steps{counter-reset:s;list-style:none;padding:0;margin:0}
.steps li{counter-increment:s;position:relative;padding:0 0 12px 46px}
.steps li:before{content:counter(s);position:absolute;left:0;top:0;width:32px;height:32px;border-radius:50%;background:var(--ocher);color:#fff;display:grid;place-items:center;font-weight:700;font-size:14px}
.prompt{border:1px solid var(--line);border-radius:14px;background:var(--paper);margin:0 0 18px;overflow:hidden}
.prompt .ph{display:flex;align-items:center;gap:10px;padding:12px 16px;background:#f3ead6;border-bottom:1px solid var(--line)}
.prompt .ph b{font-size:16px}
.prompt .ph .n{width:26px;height:26px;border-radius:50%;background:var(--teal);color:#fff;display:grid;place-items:center;font-size:13px;font-weight:700;flex:none}
.prompt .ph button{margin-left:auto}
.prompt pre{margin:0;padding:18px 20px;white-space:pre-wrap;word-break:keep-all;font-family:"IBM Plex Sans KR",sans-serif;font-size:18px;line-height:1.85;background:#fffefb}
.prompt .why{padding:12px 20px 16px;font-size:16px;color:#4a463e;border-top:1px dashed var(--line)}
.prompt .why div{margin:2px 0}
button.copy{font:inherit;font-size:13px;font-weight:600;border:1px solid var(--teal);color:var(--teal);background:#fff;border-radius:99px;padding:4px 14px;cursor:pointer}
button.copy:hover{background:var(--teal-bg)}
button.copy.done{background:var(--teal);color:#fff}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:720px){.grid2{grid-template-columns:1fr}th,td{padding:8px}}
label.chk{display:flex;gap:10px;align-items:flex-start;padding:6px 0;cursor:pointer}
label.chk input{margin-top:6px;width:18px;height:18px;accent-color:var(--teal)}
footer{padding:36px 24px 60px;color:var(--mute);font-size:14px}
code{background:#f1ead8;padding:1px 6px;border-radius:5px;font-size:.92em}
.slot{background:var(--ocher-bg);border-radius:4px;padding:0 4px;font-weight:600}

html,body{height:100%}
body{overflow:hidden}
#top{position:fixed;top:0;left:0;right:0;height:46px;display:flex;align-items:center;gap:12px;padding:0 16px;background:rgba(250,246,238,.96);border-bottom:1px solid var(--line);z-index:10;font-size:14px;color:var(--mute)}
#top b{color:var(--ink)}
#bar{position:absolute;left:0;bottom:-1px;height:3px;background:var(--ocher);width:0;transition:width .25s}
#stage{position:fixed;top:46px;bottom:62px;left:0;right:0;overflow:hidden}
.page{position:absolute;inset:0;overflow-y:auto;padding:28px 24px 24px;display:none}
.page.on{display:block;animation:in .25s ease}
@keyframes in{from{opacity:0;transform:translateX(14px)}to{opacity:1;transform:none}}
.inner{max-width:900px;margin:0 auto}
.cover{min-height:60vh;display:flex;flex-direction:column;justify-content:center}
.cover .hint{margin-top:24px;color:var(--mute);font-size:14px}
#bottom{position:fixed;bottom:0;left:0;right:0;height:62px;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:0 16px;background:rgba(250,246,238,.97);border-top:1px solid var(--line);z-index:10}
#bottom button{font:inherit;font-weight:600;border:1px solid var(--ocher);color:var(--ocher);background:#fff;border-radius:99px;padding:9px 22px;cursor:pointer}
#bottom button.primary{background:var(--ocher);color:#fff}
#bottom button:disabled{opacity:.35;cursor:default}
#dots{display:flex;gap:5px;flex-wrap:wrap;justify-content:center;max-width:46vw}
#dots i{width:9px;height:9px;border-radius:50%;background:var(--line);cursor:pointer}
#dots i.on{background:var(--ocher);transform:scale(1.3)}
@media(max-width:720px){#dots{display:none}.page{padding:20px 16px}}
h1{font-size:clamp(26px,5vw,40px)}
ol.steps li{padding-bottom:6px}

.hah{display:flex;align-items:stretch;gap:10px;margin:18px 0}
.hah .b{flex:1;border-radius:14px;padding:16px 16px 14px;border:1px solid var(--line);background:var(--paper)}
.hah .b.h{background:var(--ocher-bg);border-color:#e3cd9b}
.hah .b.a{background:var(--teal-bg);border-color:#a9d3cf}
.hah .b b.k{display:block;font-family:'Gowun Batang',serif;font-size:22px;margin-bottom:2px}
.hah .b small{display:block;color:var(--mute);font-size:13px;margin-bottom:8px}
.hah .ar{display:grid;place-items:center;font-size:22px;color:var(--ocher)}
@media(max-width:720px){.hah{flex-direction:column}.hah .ar{transform:rotate(90deg)}}
.lead{max-width:none}.ln{display:block}.nw{white-space:nowrap}
code.url{white-space:nowrap;font-size:.8em}ol.steps li{min-height:38px}

.shot{position:relative;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff;line-height:0}
.shot img{width:100%;height:auto;display:block}
.shot .ring{position:absolute;left:50.9%;top:69.6%;width:20.2%;height:24%;border:3px solid var(--warn);border-radius:12px;box-shadow:0 0 0 3px rgba(168,67,44,.18)}
.shot .ring b{position:absolute;right:-3px;top:-15px;background:var(--warn);color:#fff;font-size:12px;line-height:1;padding:4px 9px;border-radius:99px}
.cap{font-size:13px;color:var(--mute);margin:8px 0 0;line-height:1.6}
a.btn{display:inline-block;padding:9px 18px;border-radius:10px;background:var(--teal);color:#fff;font-weight:700;text-decoration:none}
.flow4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:18px 0}
.flow4 .b{border-radius:14px;padding:14px 14px 12px;border:1px solid var(--line);background:var(--paper)}
.flow4 .b.h{background:var(--ocher-bg);border-color:#e3cd9b}
.flow4 .b.a{background:var(--teal-bg);border-color:#a9d3cf}
.flow4 .b b.k{display:block;font-family:'Gowun Batang',serif;font-size:20px;margin-bottom:2px}
.flow4 .b small{display:block;color:var(--mute);font-size:13px;margin-bottom:6px}
@media(max-width:860px){.flow4{grid-template-columns:1fr 1fr}}
@media(max-width:480px){.flow4{grid-template-columns:1fr}}
.math{font-family:'IBM Plex Sans KR',sans-serif;white-space:nowrap}
</style>
</head>
<body>
<div id="top"><b>3차시</b><span id="top-label"></span><span style="margin-left:auto" id="cnt"></span><div id="bar"></div></div>
<div id="stage">
<section class="page" id="pg0" data-label="표지"><div class="inner"><div class="cover"><p class="eyebrow">교과별 AI 디지털 수업 실천과정 · 3차시</p>
<h1>스노클 활용하기</h1>
<p class="lead"><span class="ln">스노클(Snorkl)로 수업을 해 봅니다.</span></p>
<p class="hint">오른쪽 화살표 키, 아래 버튼, 화면 좌우 밀기로 넘길 수 있습니다.</p></div></div></section>
<section class="page" id="pg1" data-label="준비 중"><div class="inner"><h2><span class="no">1</span>내용 준비 중</h2>
<p class="sub">이 장부터 내용이 채워집니다.</p></div></section>
<div id="bottom"><button id="prev">◀ 이전</button><div id="dots"></div><button id="next" class="primary">다음 ▶</button></div>
<script>
(function(){
var pages=[].slice.call(document.querySelectorAll('.page'));
var n=pages.length,cur=0;
var top=document.getElementById('top-label'),bar=document.getElementById('bar'),cnt=document.getElementById('cnt');
var prev=document.getElementById('prev'),next=document.getElementById('next'),dots=document.getElementById('dots');
pages.forEach(function(p,i){var d=document.createElement('i');d.title=p.dataset.label;d.onclick=function(){go(i)};dots.appendChild(d)});
function go(i,keepHash){
  cur=Math.max(0,Math.min(n-1,i));
  pages.forEach(function(p,k){p.classList.toggle('on',k===cur)});
  [].forEach.call(dots.children,function(d,k){d.classList.toggle('on',k===cur)});
  pages[cur].scrollTop=0;
  top.textContent=pages[cur].dataset.label;
  cnt.textContent=(cur+1)+' / '+n;
  bar.style.width=((cur+1)/n*100)+'%';
  prev.disabled=cur===0;next.disabled=cur===n-1;
  next.textContent=cur===n-1?'끝':'다음 ▶';
  if(!keepHash){try{history.replaceState(null,'','#s'+(cur+1))}catch(e){try{location.hash='s'+(cur+1)}catch(e2){}}}
}
function fromHash(){var m=/^#s(\d+)$/.exec(location.hash);return m?parseInt(m[1],10)-1:0}
prev.onclick=function(){go(cur-1)};next.onclick=function(){go(cur+1)};
document.addEventListener('keydown',function(e){
  if(e.target&&/INPUT|TEXTAREA|SELECT/.test(e.target.tagName))return;
  if(e.key==='ArrowRight'||e.key==='PageDown'){go(cur+1)}
  else if(e.key==='ArrowLeft'||e.key==='PageUp'){go(cur-1)}
  else if(e.key==='Home'){go(0)}else if(e.key==='End'){go(n-1)}
});
var sx=null,sy=null;
document.getElementById('stage').addEventListener('touchstart',function(e){sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});
document.getElementById('stage').addEventListener('touchend',function(e){
  if(sx===null)return;var dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;
  if(Math.abs(dx)>70&&Math.abs(dx)>Math.abs(dy)*1.6){go(cur+(dx<0?1:-1))}sx=null;
},{passive:true});
window.addEventListener('hashchange',function(){go(fromHash(),true)});
document.querySelectorAll('button.copy').forEach(function(b){
  b.addEventListener('click',function(){
    var el=document.getElementById(b.dataset.t),text=el.innerText;
    function ok(){b.textContent='복사됨';b.classList.add('done');setTimeout(function(){b.textContent='복사';b.classList.remove('done')},1600)}
    function fb(){var r=document.createRange();r.selectNodeContents(el);var s=window.getSelection();s.removeAllRanges();s.addRange(r);b.textContent='선택됨 · Ctrl+C';setTimeout(function(){b.textContent='복사'},2200)}
    try{if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(text).then(ok,fb)}else{fb()}}catch(e){fb()}
  });
});
go(fromHash(),true);
})();

(function(){
var sel='p,li,td,th,.note,.gold,.warn,.why>div,pre,label.chk span';
document.querySelectorAll(sel).forEach(function(el){
  var w=document.createTreeWalker(el,NodeFilter.SHOW_TEXT),n,last=null;
  while(n=w.nextNode()){if(n.textContent.trim())last=n}
  if(!last)return;
  var t=last.textContent.replace(/\s+$/,''),tail=last.textContent.slice(t.length);
  var i=t.lastIndexOf(' ');
  if(i>0&&t.length-i<=7){last.textContent=t.slice(0,i)+'\u00A0'+t.slice(i+1)+tail}
});
})();

</script>
</body>
</html>
